{% extends "base.html" %}

{% block content %}
<div class="container py-5" style="max-width: 800px;">
    <h1 class="fw-bold text-center mb-5" style="color: #00d4ff;">🏆 Таблица лидеров</h1>
    <div class="game-card">
        {% for user in users %}
        <div class="d-flex align-items-center justify-content-between py-3"
             style="border-bottom: 1px solid rgba(255,255,255,0.07);">
            <div class="d-flex align-items-center gap-3">
                <span class="fw-bold" style="width: 32px; color: #00d4ff; font-size: 18px;">
                    {{ loop.index }}
                </span>
                <span class="fw-semibold" style="color: #fff; font-size: 16px;">
                    {{ user.username }}
                </span>
            </div>
            <span style="color: #aaa; font-size: 15px;">
                ⚔️ {{ user.kills }} убийств
            </span>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
