<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Battle Arena{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container-fluid px-5">
            <a class="navbar-brand" href="/">⚔️ BATTLE ARENA</a>
            <div class="ms-auto">
                {% if user %}
                    <span style="width: 100px; margin-right: 20px; color: #00d4ff;">{{ user.username }} (⭐ {{ user.balance or 0 }})</span>
                {% else %}
                    <a href="/login" class="btn btn-outline-info btn-lg" style="margin-right: 10px; border-radius: 12px;">Вход</a>
                    <a href="/register" class="btn btn-outline-info btn-lg" style="border-radius: 12px;">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <div class="footer">
        <p>&copy; 2026 Battle Arena</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
